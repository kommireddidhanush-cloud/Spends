name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffolding and Patching Project
        run: |
          mkdir -p temp_src
          cp main.dart temp_src/main.dart 2>/dev/null || true
          cp lib/main.dart temp_src/main.dart 2>/dev/null || true
          flutter create --org com.spends --project-name spends app_scaffold
          rm -rf app_scaffold/lib/main.dart
          cp temp_src/main.dart app_scaffold/lib/main.dart
          cd app_scaffold
          flutter pub add telephony intl
          
          # Fix missing namespace in telephony plugin for modern Gradle
          echo "subprojects { subproject -> afterEvaluate { if (subproject.hasProperty('android')) { if (!subproject.android.hasProperty('namespace') || subproject.android.namespace == null) { subproject.android { namespace subproject.group } } } } }" >> android/build.gradle
          
          # Add SMS permissions
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECEIVE_SMS"/>\n    <uses-permission android:name="android.permission.READ_SMS"/>' android/app/src/main/AndroidManifest.xml

      - name: Build Standalone APK
        run: |
          cd app_scaffold
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spends-app
          path: app_scaffold/build/app/outputs/flutter-apk/app-release.apk
